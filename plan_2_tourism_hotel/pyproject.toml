[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "macao-tourism"
version = "0.1.0"
description = "MacaoTourismHotel — Plan 2: post-pandemic visitor mix and hotel occupancy by star tier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "fonttools>=4.68.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/macao_tourism"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
